[project]
name = "nsr"
version = "0.1.0"
description = "NSE research: point-in-time data pipeline and forward-tested prediction system (paper only)"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "pyarrow>=16", "requests>=2.32", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nsr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
